spring:
  application:
    name: calculator
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/app_db}
    username: ${DATABASE_USER:app_user}
    password: ${DATABASE_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: validate   # none | validate | update | create | create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect